services:
  interfaces:
    build:
      context: .
      dockerfile: uis/Dockerfile
    env_file:
      - .env
    environment:
      BACKEND_URL: "${BACKEND_URL}"
      NEXT_INTERNAL_PORT: "${NEXT_INTERNAL_PORT}"
      NEXT_PUBLIC_NEXOVA_API_BASE: "${NEXT_PUBLIC_NEXOVA_API_BASE}"
      NEXT_PUBLIC_INCIDENT_ANALYSIS_API_BASE: "${NEXT_PUBLIC_INCIDENT_ANALYSIS_API_BASE}"
      NEXT_PUBLIC_TELEMETRY_ENDPOINT: "${NEXT_PUBLIC_TELEMETRY_ENDPOINT}"
    ports:
      - "${WEBSITE_PORT}:3000"
      - "${BACKOFFICE_PORT}:3001"
    volumes:
      - ./uis/website:/app/website:ro
      - ./uis/backoffice/talent-pipeline-tracker:/app/backoffice
      - ./uis/proxy-server.js:/app/proxy-server.js:ro
      - ./uis/start.sh:/app/start.sh:ro
      - interfaces_node_modules:/app/backoffice/node_modules
      - interfaces_next_cache:/app/backoffice/.next
    networks:
      - nexova

  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    env_file:
      - .env
    environment:
      TELEMETRY_DATABASE_URL: "${TELEMETRY_DATABASE_URL}"
      REPORTING_DATABASE_URL: "${REPORTING_DATABASE_URL}"
      PREFECT_API_URL: "http://prefect-server:4200/api"
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./services/api:/app/services/api
      - ./packages/shared/python:/app/packages/shared/python
      - ./services/data:/app/services/data
    depends_on:
      reporting-db:
        condition: service_healthy
    networks:
      - nexova

  reporting-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${REPORTING_DB_NAME:-nexova_reporting}"
      POSTGRES_USER: "${REPORTING_DB_USER:?Set REPORTING_DB_USER in .env}"
      POSTGRES_PASSWORD: "${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD in .env}"
    volumes:
      - reporting_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - nexova

  prefect-server:
    build:
      context: .
      dockerfile: services/reporting-worker/Dockerfile
    command: ["uv", "run", "--project", "/app/services/api", "prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_HOME: /var/lib/prefect
      PREFECT_API_URL: "http://prefect-server:4200/api"
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect_server_data:/var/lib/prefect
    restart: unless-stopped
    networks:
      - nexova

  reporting-worker:
    build:
      context: .
      dockerfile: services/reporting-worker/Dockerfile
    command: ["uv", "run", "--project", "/app/services/api", "prefect", "worker", "start", "--pool", "reporting-process-pool"]
    environment:
      PREFECT_API_URL: "http://prefect-server:4200/api"
      TELEMETRY_DATABASE_URL: "${TELEMETRY_DATABASE_URL}"
      REPORTING_DATABASE_URL: "${REPORTING_DATABASE_URL}"
      PREFECT_HOME: /var/lib/prefect
    volumes:
      - prefect_worker_data:/var/lib/prefect
    depends_on:
      reporting-db:
        condition: service_healthy
      prefect-server:
        condition: service_started
    restart: unless-stopped
    networks:
      - nexova

  reporting-deployer:
    build:
      context: .
      dockerfile: services/reporting-worker/Dockerfile
    command: ["sh", "/app/services/reporting-worker/deploy.sh"]
    environment:
      PREFECT_API_URL: "http://prefect-server:4200/api"
      PREFECT_HOME: /var/lib/prefect
    volumes:
      - prefect_worker_data:/var/lib/prefect
    depends_on:
      - prefect-server
    profiles: ["reporting-setup"]
    networks:
      - nexova

  inventory-outbox-worker:
    build:
      context: .
      dockerfile: services/inventory-outbox-worker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      TELEMETRY_DATABASE_URL: "${TELEMETRY_DATABASE_URL}"
      OUTBOX_POLL_SECONDS: "${OUTBOX_POLL_SECONDS:-2}"
      OUTBOX_BATCH_SIZE: "${OUTBOX_BATCH_SIZE:-50}"
      OUTBOX_LEASE_SECONDS: "${OUTBOX_LEASE_SECONDS:-60}"
      OUTBOX_MAX_ATTEMPTS: "${OUTBOX_MAX_ATTEMPTS:-10}"
      OUTBOX_BACKOFF_BASE_SECONDS: "${OUTBOX_BACKOFF_BASE_SECONDS:-2}"
      OUTBOX_BACKOFF_MAX_SECONDS: "${OUTBOX_BACKOFF_MAX_SECONDS:-900}"
      OUTBOX_RETENTION_DAYS: "${OUTBOX_RETENTION_DAYS:-90}"
      OUTBOX_JITTER_FRACTION: "${OUTBOX_JITTER_FRACTION:-0.2}"
    volumes:
      - ./services/data:/app/services/data
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - nexova

volumes:
  interfaces_node_modules:
  interfaces_next_cache:
  reporting_postgres_data:
  prefect_server_data:
  prefect_worker_data:

networks:
  nexova:
    name: "${DOCKER_NETWORK_NAME}"
