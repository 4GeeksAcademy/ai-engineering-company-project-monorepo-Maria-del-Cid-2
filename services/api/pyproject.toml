[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexova-incident-analysis"
version = "0.1.0"
description = "Domain contracts for Nexova incident analysis"
requires-python = ">=3.11"
dependencies = [
	"fastapi>=0.110,<1",
	"email-validator>=2,<3",
	"python-multipart>=0.0.9,<1",
	"tinydb>=4.8,<5",
	"uvicorn>=0.29,<1",
	"python-jose[cryptography]>=3.3,<4",
	"libpass[bcrypt]>=1.9,<2",
	"python-dotenv>=1.0,<2",
	"nexova-shared",
	"sqlmodel>=0.0.24,<0.1",
	"psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
# Requerido por fastapi.testclient.TestClient.
test = [
	"httpx>=0.27,<1",
]

[project.scripts]
seed = "app.suppliers.seed:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.uv.sources]
nexova-shared = { path = "../../packages/shared/python", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
